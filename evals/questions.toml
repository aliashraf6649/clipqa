# ClipQA eval questions. Answers are not written here: scripts/print_answer_key.py
# computes them from the ground truth with the functions in clipqa.track_tools.
# The few answers that can't be computed (colours, clothes) are labelled by hand,
# with the people they refer to noted in a comment. "Person N" means track N in
# the clip's ground truth.

# ---------------------------------------------------------------------------
# MOT17-02: a square in daylight (20 s). Most people walk left to right.
# ---------------------------------------------------------------------------

[[question]]
id = "02-01"
clip = "MOT17-02"
lang = "en"
text = "How many people can you see at the 5-second mark?"
answer_type = "count"
truth = { tool = "count_at", label = "person", t = 5 }

[[question]]
id = "02-02"
clip = "MOT17-02"
lang = "en"
text = "How many people are in view at the 15-second mark?"
answer_type = "count"
truth = { tool = "count_at", label = "person", t = 15 }

[[question]]
id = "02-03"
clip = "MOT17-02"
lang = "ar"
text = "كم شخصًا مختلفًا يظهر في هذا المقطع؟"
answer_type = "count"
truth = { tool = "count_objects", label = "person" }

[[question]]
id = "02-04"
clip = "MOT17-02"
lang = "en"
text = "How many different people appear between the 10-second and 15-second marks?"
answer_type = "count"
truth = { tool = "count_objects", label = "person", t_from = 10, t_to = 15 }

[[question]]
id = "02-05"
clip = "MOT17-02"
lang = "en"
text = "How many people walk past the middle of the frame from left to right?"
answer_type = "count"
truth = { tool = "count_crossings", label = "person", x = 960, direction = "left_to_right" }

[[question]]
id = "02-06"
clip = "MOT17-02"
lang = "ar"
text = "كم شخصًا يعبر منتصف الصورة من اليمين إلى اليسار؟"
answer_type = "count"
truth = { tool = "count_crossings", label = "person", x = 960, direction = "right_to_left" }

[[question]]
id = "02-07"
clip = "MOT17-02"
lang = "en"
text = "Is there a car anywhere in this clip?"
answer_type = "yes_no"
truth = { tool = "count_objects", label = "car" }

[[question]]
id = "02-08"
clip = "MOT17-02"
lang = "en"
text = "How many people can you see at the very start of the clip?"
answer_type = "count"
truth = { tool = "count_at", label = "person", t = 0 }


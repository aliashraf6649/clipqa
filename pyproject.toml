[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "clipqa"
version = "0.1.0"
description = "Ask questions about short street and traffic clips; answers come with timestamps and evidence frames."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "polars>=2.2",
    "ultralytics>=8.4",
]